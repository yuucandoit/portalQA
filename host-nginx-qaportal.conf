# ==============================================================================
# Nginx Host Configuration for QA Portal (Docker Container Port 9012)
# Lokasi di Server Ubuntu: /etc/nginx/sites-available/qaportal
# (atau file konfigurasi domain Anda di /etc/nginx/sites-available/)
# ==============================================================================

# Map connection upgrade for WebSocket compatibility
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name poqa.rexensoft.com; # <-- Domain Anda

    client_max_body_size 64M;

    # --------------------------------------------------------------------------
    # 1. Forward Web Traffic ke Docker Container di Port 9012
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:9012;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 2. Forward Real-Time WebSocket Proxy (Team Chat & Live Notifications)
    #    Browser wss://poqa.rexensoft.com/ws -> Docker container port 9012 /ws
    # --------------------------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:9012/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep connection open for WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
